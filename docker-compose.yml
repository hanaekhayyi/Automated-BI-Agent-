services:

  n8n:
    image: n8nio/n8n:latest

    container_name: automated-bi-n8n

    ports:
      - "5678:5678"

    environment:
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: automated-bi-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data

    restart: unless-stopped

  python-quality:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: automated-bi-python-quality
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data: